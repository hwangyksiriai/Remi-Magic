<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Windows 요술봉 커서 만들기</title><style>body{font-family:system-ui;background:#fff8fc;color:#60465b;padding:32px;max-width:1050px;margin:auto}h1{font-size:25px}button,a{padding:12px 18px;border:1px solid #c899b7;border-radius:9px;background:#fff;color:#825875;font:inherit;cursor:pointer;display:inline-block;margin:6px;text-decoration:none}canvas{width:128px;height:128px;background:repeating-conic-gradient(#ece7ec 0 25%,#fff 0 50%) 0/20px 20px;border:1px solid #d4c8d3;border-radius:8px;margin:6px}#frames{display:flex;gap:6px;flex-wrap:wrap}#files{margin:24px 0}p{line-height:1.7}#status{font-weight:600}</style></head><body><h1>Windows에서 직접 사용하는 요술봉 커서</h1><p>24프레임의 움직이는 요술봉과 돌아가는 리듬탭을 Windows 커서 파일로 렌더링합니다.</p><button id="generate">커서 파일 만들기</button><p id="status" role="status">준비됐어요</p><div id="files"></div><div id="frames" aria-label="커서 프레임 미리보기"></div><script src="desktop-cursor.js" defer></script></body></html>
