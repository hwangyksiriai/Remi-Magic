<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>레미의 마법 커서</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="eyebrow"><span class="tiny-star">✦</span> REMI MAGIC</div>
        <h1>오늘도, 마법처럼.</h1>
        <p>내 하루에 맞추는 작은 마법</p>
        <div class="wand-art" aria-hidden="true"><div class="wand-orb"><i></i><i></i><i></i><i></i><i></i><i></i><b>♪</b></div><div class="wand-stem"></div><span>✧</span></div>
      </header>

      <section class="master-row">
        <div><h2>마법 커서</h2><p id="enabled-label">설정을 불러오는 중…</p></div>
        <label class="switch"><input type="checkbox" id="enabled" aria-label="마법 커서 켜기" /><span></span></label>
      </section>

      <section class="settings" aria-label="마법 설정">
        <fieldset class="mode-picker"><legend>오늘의 모드</legend><div class="mode-options">
          <label><input type="radio" name="mode" value="magic" checked /><span>✦ 마법 모드</span></label>
          <label><input type="radio" name="mode" value="focus" /><span>집중 모드</span></label>
        </div><p id="mode-description">마법 소리와 별빛 잔상을 즐겨요.</p></fieldset>
        <label class="setting-row site-row"><span><strong>이 사이트에서 사용</strong><small id="site-name">현재 사이트 확인 중…</small></span><span class="switch"><input type="checkbox" id="site-enabled" disabled /><span></span></span></label>
        <label class="setting-row"><span><strong>전체 소리</strong><small id="sound-description">Alt + Shift + M으로 즉시 음소거</small></span><span class="switch"><input type="checkbox" id="sound" /><span></span></span></label>
        <label class="setting-row"><span><strong>별빛 잔상</strong><small>요술봉 뒤로 흩어지는 반짝임</small></span><span class="switch"><input type="checkbox" id="trail" /><span></span></span></label>
        <label class="setting-row"><span><strong>길게 눌러 변신</strong><small>빈 곳에서 왼쪽 버튼을 꾹 눌러요</small></span><span class="switch"><input type="checkbox" id="holdToTransform" /><span></span></span></label>
        <label class="setting-row"><span><strong>변신 후 캡처</strong><small>끄면 저장 없이 변신만 감상해요</small></span><span class="switch"><input type="checkbox" id="captureOnTransform" /><span></span></span></label>
        <div class="range-row"><label for="size">요술봉 크기</label><output id="size-value" for="size">160 px</output><input id="size" type="range" min="100" max="240" step="5" value="160" /></div>

        <details class="advanced"><summary>소리 · 캐릭터 세부 설정</summary>
          <fieldset class="audio-options"><legend>소리별 켜기 / 끄기</legend>
            <label class="setting-row"><strong>클릭 효과음</strong><span class="switch"><input type="checkbox" id="clickSound" /><span></span></span></label>
            <label class="setting-row"><strong>스크롤 효과음</strong><span class="switch"><input type="checkbox" id="scrollSound" /><span></span></span></label>
            <label class="setting-row"><strong>주문 음성</strong><span class="switch"><input type="checkbox" id="spellVoice" /><span></span></span></label>
            <label class="setting-row"><strong>변신 효과음 · 음악</strong><span class="switch"><input type="checkbox" id="transformSound" /><span></span></span></label>
          </fieldset>
          <div class="range-row"><label for="volume">전체 음량</label><output id="volume-value" for="volume">44%</output><input id="volume" type="range" min="0" max="0.5" step="0.01" value="0.22" /></div>
          <div class="character-row"><label for="character">변신 캐릭터</label><select id="character"><option value="remi">도레미</option><option value="hazuki">장메이</option><option value="aiko">유사랑</option><option value="onpu">진보라</option><option value="momoko">나모모</option></select></div>
          <div class="character-row"><label for="language">주문 음성 언어</label><select id="language"><option value="ko">한국어</option><option value="ja">日本語</option></select></div>
          <label class="setting-row"><span><strong>다른 언어 원음 허용</strong><small>선택한 언어가 없을 때 같은 캐릭터의 녹음 사용</small></span><span class="switch"><input type="checkbox" id="languageFallback" /><span></span></span></label>
          <label class="setting-row"><span><strong>시스템 시연 음성</strong><small>녹음이 없을 때 사용 · 원본 성우 아님</small></span><span class="switch"><input type="checkbox" id="voiceFallback" /><span></span></span></label>
          <p id="voice-status" class="voice-status" role="status"></p>
          <div class="range-row"><label for="holdDuration">꾹 누르는 시간</label><output id="holdDuration-value" for="holdDuration">0.9초</output><input id="holdDuration" type="range" min="500" max="1800" step="100" value="900" /></div>
        </details>
      </section>

      <aside class="how-to"><span aria-hidden="true">✧</span><p id="how-to-text">움직이면 요술봉, 스크롤하면 리듬탭.<br />작은 별의 보석 중심이 클릭 위치예요.</p></aside>
      <button class="demo-button" id="open-demo" type="button">마법 연습실 열기 <span aria-hidden="true">↗</span></button>
      <footer><span id="save-status" role="status" aria-live="polite">설정은 자동으로 저장돼요</span><button id="reset" type="button">초기화</button></footer>
      <p class="compatibility">Windows · macOS의 Chrome / Edge용<br />설정·새 탭·스토어 등 보호 페이지에서는 사용할 수 없어요. 캡처는 현재 보이는 웹페이지를 저장해요.</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
